name: Feature request
description: Propose a focused improvement to Rulefall.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What instruction-resolution problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful interaction or output.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Provider semantics
        - Lifecycle visualization
        - Workspace import
        - Export or sharing
        - Accessibility
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Link official docs, a small public fixture, or an adjacent tool if relevant.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request does not require uploading private repositories to a hosted service.
          required: true
